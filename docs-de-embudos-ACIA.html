  }
  function bind(el, obj, key) {
    el.value = obj[key] || '';
    el.addEventListener('input', function () { obj[key] = el.value; });
    return el;
  }
  function labeled(text, input, hint) {
    return h('label', { class: 'lbl', for: input.id }, text, hint ? h('small', { text: hint }) : null, input);
  }
  function move(i, d) {
    var a = state.editing.tools, j = i + d;
    if (j < 0 || j >= a.length) return;
    var x = a[i]; a[i] = a[j]; a[j] = x; render();
  }
  function toolForm(t, i) {
    var p = 't' + i + '-';
    var up = h('button', { class: 'btn small', type: 'button', text: 'Subir', onclick: function () { move(i, -1); } });
    var down = h('button', { class: 'btn small', type: 'button', text: 'Bajar', onclick: function () { move(i, 1); } });
    if (i === 0) up.disabled = true;
    if (i === state.editing.tools.length - 1) down.disabled = true;
    return h('div', { class: 'tool-form' },
      h('div', { class: 'th' }, h('b', { text: 'Herramienta ' + (i + 1) }),
        h('div', { class: 'sp' }, up, down, h('button', { class: 'btn small danger', type: 'button', text: 'Quitar', onclick: function () { state.editing.tools.splice(i, 1); render(); } }))),
      h('div', { class: 'grid2' },
        labeled('Nombre', bind(h('input', { class: 'field', id: p + 'title', type: 'text' }), t, 'title')),
        labeled('Para qué sirve', bind(h('input', { class: 'field', id: p + 'what', type: 'text' }), t, 'what'))),
      labeled('Enlace de la herramienta', bind(h('input', { class: 'field', id: p + 'url', type: 'url', placeholder: 'https://' }), t, 'url')),
      labeled('Datos de apoyo', bind(h('textarea', { class: 'field', id: p + 'det' }), t, 'detailsText'), 'Uno por línea, con el formato Nombre: valor. Quien use la página los copia con un clic.'),
      h('div', { class: 'grid2' },
        labeled('Documento de copys', bind(h('input', { class: 'field', id: p + 'cname', type: 'text' }), t, 'copyName'), 'Nombre del archivo en Drive.'),
        labeled('Enlace de los copys', bind(h('input', { class: 'field', id: p + 'curl', type: 'url', placeholder: 'https://docs.google.com/…' }), t, 'copyUrl'))));
  }
  function addTool(key) {
    var tp = TEMPLATES[key];
    state.editing.tools.push({ title: tp.title, what: tp.what, url: '', detailsText: tp.detailsText, copyName: '', copyUrl: '' });
    render();
    var n = state.editing.tools.length - 1, el = document.getElementById('t' + n + '-title'); if (el) el.focus();
  }

  function renderForm() {
    var ed = state.editing;
    app.replaceChildren();
    var form = h('form', { class: 'form', novalidate: true });
    form.appendChild(h('h2', { text: ed.isNew ? 'Nuevo embudo' : 'Editar embudo' }));
    form.appendChild(labeled('Nombre del embudo', bind(h('input', { class: 'field', id: 'f-name', type: 'text', required: true }), ed, 'name')));
    form.appendChild(labeled('Carpeta madre en Drive', bind(h('input', { class: 'field', id: 'f-furl', type: 'url', placeholder: 'https://drive.google.com/drive/folders/…' }), ed, 'folderUrl'), 'Enlace de la carpeta del curso.'));
    ed.tools.forEach(function (t, i) { form.appendChild(toolForm(t, i)); });
    var add = h('div', { class: 'add-row' }, h('span', { text: 'Agregar:' }));
    Object.keys(TEMPLATES).forEach(function (k) {
      add.appendChild(h('button', { class: 'btn small', type: 'button', text: TEMPLATES[k].label, onclick: function () { addTool(k); } }));
    });
    form.appendChild(add);
    var left = h('div', { class: 'sp' },
      h('button', { class: 'btn primary', type: 'submit', text: state.saving ? 'Guardando…' : 'Guardar', disabled: state.saving }),
      h('button', { class: 'btn', type: 'button', text: 'Cancelar', onclick: function () { state.editing = null; state.confirmDelete = false; render(); } }));
    var right = h('div', { class: 'sp' });
    if (!ed.isNew) {
      if (!state.confirmDelete) right.appendChild(h('button', { class: 'btn danger', type: 'button', text: 'Eliminar embudo', onclick: function () { state.confirmDelete = true; render(); } }));
      else {
        right.appendChild(h('span', { class: 'pending', text: 'Se borra el embudo completo' }));
        right.appendChild(h('button', { class: 'btn danger', type: 'button', text: 'Sí, eliminar', onclick: removeFunnel }));
        right.appendChild(h('button', { class: 'btn small', type: 'button', text: 'No', onclick: function () { state.confirmDelete = false; render(); } }));
      }
    }
    form.appendChild(h('div', { class: 'save-row' }, left, right));
    form.addEventListener('submit', function (e) { e.preventDefault(); saveFunnel(); });
    app.appendChild(form);
  }

  async function saveFunnel() {
    var ed = state.editing;
    if (!ed || state.saving) return;
    if (!ed.name.trim()) { say('Escribe el nombre del embudo.', true); var n = document.getElementById('f-name'); if (n) n.focus(); return; }
    var bad = [];
    if (ed.folderUrl.trim() && !safeUrl(ed.folderUrl)) bad.push('la carpeta');
    ed.tools.forEach(function (t, i) {
      if (t.url.trim() && !safeUrl(t.url)) bad.push('el enlace de la herramienta ' + (i + 1));
      if (t.copyUrl.trim() && !safeUrl(t.copyUrl)) bad.push('los copys de la herramienta ' + (i + 1));
    });
    if (bad.length) { say('Revisa ' + bad.join(', ') + ': el enlace debe empezar con https://', true); return; }
    var id = ed.id || slugify(ed.name);
    var data = {
      name: ed.name.trim(), order: ed.order, folderName: ed.folderName.trim(), folderUrl: ed.folderUrl.trim(),
      tools: ed.tools.map(function (t) {
        return { title: t.title.trim(), what: t.what.trim(), url: t.url.trim(), details: textToDetails(t.detailsText), copyName: t.copyName.trim(), copyUrl: t.copyUrl.trim() };
      })
    };
    state.saving = true; render();
    try {
      state.pending = { id: id, data: data };
      await db.collection('funnels').doc(id).set(data);
      state.funnels = withPending(state.remote);
      state.selected = id; store('acia-embudo-sel', id);
      state.editing = null; state.saving = false; render();
      say('Embudo guardado');
    } catch (e) {
      state.pending = null; state.funnels = state.remote;
      state.saving = false; render();
      say(e && e.code === 'quota_exceeded' ? 'No hay espacio para más embudos.' : 'No se pudo guardar. Revisa tu acceso y vuelve a intentar.', true);
    }
  }
  async function removeFunnel() {
    var ed = state.editing;
    if (!ed || !ed.id) return;
    var id = ed.id, backup = state.remote;
    /* Se quita de la pantalla al instante; si la base lo rechaza, vuelve a aparecer con el motivo */
    state.gone[id] = true;
    if (state.pending && state.pending.id === id) state.pending = null;
    state.remote = state.remote.filter(function (x) { return x.id !== id; });
    state.funnels = withPending(state.remote);
    if (state.selected === id) state.selected = null;
    state.editing = null; state.confirmDelete = false;
    render(); say('Eliminando…');
    try {
      await db.collection('funnels').doc(id).delete();
      say('Embudo eliminado');
    } catch (e) {
      delete state.gone[id];
      state.remote = backup; state.funnels = withPending(backup);
      render();
      say('No se pudo eliminar' + (e && e.code ? ' (' + e.code + ')' : '') + '. Revisa que tengas permiso de Editor.', true);
    }
  }

  /* Muestra de inmediato lo que esta persona acaba de guardar, aunque la base tarde en confirmarlo */
  function withPending(list) {
    var p = state.pending;
    if (!p) return list;
    var item = Object.assign({}, p.data, { id: p.id });
    var out = list.filter(function (x) { return x.id !== p.id; });
    out.push(item);
    out.sort(function (a, b) { return (Number(a.order) || 0) - (Number(b.order) || 0); });
    return out;
  }

  function render() { if (state.editing) renderForm(); else renderView(); }

  /* ---------- Arranque ---------- */
  /* Copia incrustada por quien arma el archivo para GitHub; solo se usa cuando no hay base de datos */
  function useSeed() {
    try {
      var el = document.getElementById('seed-data');
      if (!el) return;
      var seed = JSON.parse(el.textContent);
      var list = Array.isArray(seed.funnels) ? seed.funnels : [];
      state.remote = list; state.funnels = list;
      state.offline = true; state.loaded = true; state.savedAt = seed.savedAt || '';
    } catch (e) {}
  }
  async function cap(name) {
    try { return window.claude && window.claude.use ? await window.claude.use(name) : null; } catch (e) { return null; }
  }
  (async function boot() {
    var hash = (location.hash || '').replace(/^#/, '');
    state.selected = hash || load('acia-embudo-sel');
    render();
    var user = await cap('user');
    try { canEdit = user ? !!(await user.canEdit()) : false; } catch (e) { canEdit = false; }
    db = await cap('db');
    state.booting = false;
    if (!db) { useSeed(); render(); return; }
    var slow = setTimeout(function () { if (!state.loaded) say('Está tardando más de lo normal en cargar. Revisa tu conexión.', true); }, 10000);
    try {
      db.collection('funnels').orderBy('order').onSnapshot(function (snap) {
        var inSnap = {};
        snap.docs.forEach(function (d) { inSnap[d.id] = true; });
        Object.keys(state.gone).forEach(function (id) { if (!inSnap[id]) delete state.gone[id]; });
        state.remote = snap.docs.map(function (d) { var x = d.data() || {}; x.id = d.id; return x; }).filter(function (x) { return !state.gone[x.id]; });
        if (state.pending && !snap.metadata.hasPendingWrites && state.remote.some(function (x) { return x.id === state.pending.id; })) state.pending = null;
        state.funnels = withPending(state.remote);
        if (!snap.metadata.fromCache || snap.size) { state.loaded = true; clearTimeout(slow); }
        if (!state.editing) render();
      }, function () { clearTimeout(slow); state.loaded = true; if (!state.editing) render(); });
    } catch (e) { clearTimeout(slow); db = null; render(); }
  })();
})();
</script>
</body></html>
